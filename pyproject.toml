[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemic-risk-covar-lab"
version = "1.0.0"
description = "Directional systemic-risk analysis with GARCH, copulas, and quantile regression"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
